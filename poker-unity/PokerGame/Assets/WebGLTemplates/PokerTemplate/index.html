<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1411">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0b1411; overflow: hidden;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* Fixed 1920x1080 game, scaled to fit the window (letterboxed), centred. */
    #unity-canvas { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; background: #000; }

    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; color: #cfe6da; font-size: 16px; background: #0b1411;
    }
    #bar { width: min(60vw, 360px); height: 10px; background: #1d2b25; border-radius: 6px; overflow: hidden; }
    #bar-fill { width: 0%; height: 100%; background: #3fbf7f; transition: width .15s; }

    /* Small round buttons, top centre, out of the way of the table UI. */
    #tools { position: fixed; top: max(6px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      display: none; gap: 8px; z-index: 5; }
    .tool { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
      background: rgba(10,20,16,.55); color: #fff; font-size: 20px; line-height: 36px; text-align: center;
      cursor: pointer; padding: 0; touch-action: manipulation; }
    .tool:active { background: rgba(63,191,127,.7); }

    /* Shown on a phone held upright. */
    #rotate { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; background: rgba(8,16,12,.96); color: #fff; text-align: center; padding: 24px; }
    #rotate .icon { font-size: 64px; animation: turn 2s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0); } 70%, 100% { transform: rotate(-90deg); } }
    #rotate button { font-size: 18px; padding: 12px 26px; border-radius: 28px; border: 0; background: #3fbf7f; color: #06150d; font-weight: 600; }
    #rotate small { color: #9db7aa; max-width: 320px; }
    /* Phone keyboard bar for text fields (see MobileKeyboardBridge). Sits at the top so the keyboard never covers it. */
    #kb { position: fixed; left: 0; right: 0; top: 0; z-index: 20; display: none; gap: 8px; align-items: center;
      padding: 10px 12px; background: #10211a; border-bottom: 1px solid #3fbf7f; box-sizing: border-box; }
    #kb label { color: #9db7aa; font-size: 13px; position: absolute; top: 2px; left: 14px; }
    #kb input { flex: 1; min-width: 0; font-size: 18px; padding: 10px 12px; margin-top: 12px; border-radius: 8px;
      border: 1px solid #3fbf7f; background: #0b1411; color: #fff; -webkit-user-select: text; user-select: text; }
    #kb button { margin-top: 12px; font-size: 16px; padding: 10px 16px; border-radius: 8px; border: 0; background: #3fbf7f; color: #06150d; font-weight: 600; }
    #kb button.cancel { background: #2a3a33; color: #fff; }
    #warning { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: none; }
    #warning div { padding: 8px 12px; color: #000; background: #ffd24d; }
  </style>
</head>

<body>
  <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

  <div id="loading"><div>Loading table…</div><div id="bar"><div id="bar-fill"></div></div></div>

  <div id="tools">
    <button class="tool" id="btn-full" title="Full screen" aria-label="Full screen">&#x26F6;</button>
    <button class="tool" id="btn-rotate" title="Rotate to landscape" aria-label="Rotate to landscape">&#x27F3;</button>
  </div>

  <div id="rotate">
    <div class="icon">&#x1F4F1;</div>
    <div style="font-size:20px;font-weight:600">Turn your phone sideways</div>
    <button id="btn-rotate2">Rotate to landscape</button>
    <small id="rotate-hint">The table is played in landscape.</small>
  </div>

  <div id="kb">
    <label id="kb-label"></label>
    <input id="kb-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <button id="kb-ok">OK</button>
    <button id="kb-cancel" class="cancel">&#x2715;</button>
  </div>

  <div id="warning"></div>

  <script>
    var canvas = document.getElementById("unity-canvas");
    var warning = document.getElementById("warning");
    var isTouch = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    var root = document.documentElement;
    window.pokerIsTouch = isTouch;

    // Text entry for the game's input fields on phones (Unity WebGL cannot show the keyboard itself).
    var kbBox = document.getElementById("kb"), kbInput = document.getElementById("kb-input"), kbTarget = null;
    function closeKeyboard(ok) {
      if (!kbTarget) return;
      var target = kbTarget; kbTarget = null;
      kbBox.style.display = "none";
      kbInput.blur();
      if (window.unityInstance) window.unityInstance.SendMessage(target, "OnMobileKeyboardResult", ok ? "1|" + kbInput.value : "0|");
    }
    window.pokerOpenKeyboard = function (goName, text, label, secret, numeric, maxLength) {
      kbTarget = goName;
      document.getElementById("kb-label").textContent = label || "";
      kbInput.type = secret ? "password" : "text";
      kbInput.inputMode = numeric ? "numeric" : "text";
      kbInput.maxLength = maxLength > 0 ? maxLength : 524288;
      kbInput.value = text || "";
      kbBox.style.display = "flex";
      kbInput.focus();
      kbInput.select();
    };
    document.getElementById("kb-ok").addEventListener("click", function () { closeKeyboard(true); });
    document.getElementById("kb-cancel").addEventListener("click", function () { closeKeyboard(false); });
    kbInput.addEventListener("keydown", function (e) { if (e.key === "Enter") closeKeyboard(true); });

    function inFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function canFullscreen() { return !!(root.requestFullscreen || root.webkitRequestFullscreen); }

    function enterFullscreen() {
      var p;
      if (root.requestFullscreen) p = root.requestFullscreen({ navigationUI: "hide" });
      else if (root.webkitRequestFullscreen) p = root.webkitRequestFullscreen();
      return Promise.resolve(p);
    }
    function leaveFullscreen() {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    function toggleFullscreen() {
      if (inFullscreen()) { leaveFullscreen(); return; }
      enterFullscreen().then(lockLandscape).catch(function () {});
    }

    // Android Chrome can lock the orientation once the page is full screen.
    function lockLandscape() {
      if (screen.orientation && screen.orientation.lock) return screen.orientation.lock("landscape").catch(function () {});
      return Promise.resolve();
    }

    // The "rotate" button: full screen + landscape lock where the browser allows it.
    // iPhones allow neither, so the player is told to turn the phone by hand.
    function rotateToLandscape() {
      var hint = document.getElementById("rotate-hint");
      var done = function () {
        if (window.innerHeight > window.innerWidth) {
          hint.textContent = isIOS
            ? "iPhone browsers cannot rotate the page for you. Turn the phone sideways and switch off the rotation lock."
            : "Your browser did not allow rotating. Turn the phone sideways.";
        }
        updateLayout();
      };
      if (canFullscreen() && !inFullscreen()) enterFullscreen().then(lockLandscape).then(done).catch(done);
      else lockLandscape().then(done);
    }

    // Keep the 16:9 picture as large as the window allows.
    function fitCanvas() {
      var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      canvas.style.width = Math.floor(1920 * scale) + "px";
      canvas.style.height = Math.floor(1080 * scale) + "px";
    }

    function updateLayout() {
      fitCanvas();
      var portrait = window.innerHeight > window.innerWidth;
      document.getElementById("rotate").style.display = (isTouch && portrait) ? "flex" : "none";
      // Phones and tablets only: on a desktop the game stays a plain 1920x1080 picture.
      document.getElementById("btn-full").style.display = (isTouch && canFullscreen()) ? "block" : "none";
      document.getElementById("btn-rotate").style.display = isTouch ? "block" : "none";
      document.getElementById("tools").style.display = isTouch ? "flex" : "none";
      document.getElementById("btn-full").innerHTML = inFullscreen() ? "&#x2715;" : "&#x26F6;";
    }

    document.getElementById("btn-full").addEventListener("click", toggleFullscreen);
    document.getElementById("btn-rotate").addEventListener("click", rotateToLandscape);
    document.getElementById("btn-rotate2").addEventListener("click", rotateToLandscape);
    window.addEventListener("resize", updateLayout);
    window.addEventListener("orientationchange", function () { setTimeout(updateLayout, 250); });
    document.addEventListener("fullscreenchange", updateLayout);
    document.addEventListener("webkitfullscreenchange", updateLayout);
    updateLayout();

    function showBanner(msg, type) {
      var div = document.createElement("div");
      div.innerHTML = msg;
      warning.appendChild(div);
      warning.style.display = "block";
      if (type !== "error") setTimeout(function () {
        if (div.parentNode) warning.removeChild(div);
        warning.style.display = warning.children.length ? "block" : "none";
      }, 5000);
    }

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      showBanner: showBanner,
      matchWebGLToCanvasSize: false,
      devicePixelRatio: 1
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.getElementById("bar-fill").style.width = (progress * 100) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        document.getElementById("loading").style.display = "none";
      }).catch(function (message) { alert(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
