name: Server CI

# Lint and test the Node game server on every push and pull request that touches it.
on:
  push:
    branches: [main, develop, 'feature/**']
    paths: ['poker-server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['poker-server/**', '.github/workflows/server.yml']

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: poker-server

jobs:
  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poker-server/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit + end-to-end tests (JSON storage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poker-server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e

  mongo:
    name: Storage + end-to-end tests (MongoDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poker-server/package-lock.json
      # mongodb-memory-server downloads a MongoDB binary on first use; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('poker-server/package-lock.json') }}
      - run: npm ci
      - run: npm run test:mongo
      - run: npm run test:e2e:mongo
